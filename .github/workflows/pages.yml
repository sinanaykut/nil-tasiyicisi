name: Yayımla – GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu al
        uses: actions/checkout@v7.0.1
      - name: Python kur
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.x"
      - name: Oyunu derle
        run: bash build.sh
      - name: Pages dosyalarını yükle
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Pages'i yapılandır
        uses: actions/configure-pages@v6.0.0
      - name: Siteyi yayımla
        id: deployment
        uses: actions/deploy-pages@v5.0.1
